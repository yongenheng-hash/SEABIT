name: Update SEABIT feed

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install feedparser
        run: pip install feedparser

      - name: Build the feed
        run: python update.py

      - name: Commit feed.json if it changed
        run: |
          git config user.name "seabit-bot"
          git config user.email "actions@github.com"
          git add feed.json
          if git diff --staged --quiet; then
            echo "No change today — nothing to commit."
          else
            git commit -m "feed: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
