<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SEABIT — global macro, filtered</title>
<meta name="description" content="Every central bank decision, inflation print and policy signal that matters, summarised and grouped by source. Updated daily.">
<meta name="theme-color" content="#0E1621">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#0E1621;
  --panel:#141F2C;
  --panel-2:#1A2634;
  --rule:#243244;
  --rule-soft:#1C2836;
  --text:#E6ECF2;
  --text-2:#A9B8C7;
  --muted:#6F8296;
  --hawk:#E9A13B;
  --dove:#4FC3D9;
  --hold:#7E8FA1;
  --flash:#F2603C;
  --masthead:rgba(14,22,33,.94);
  --shadow:rgba(0,0,0,.35);
  --display:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --editorial:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}

/* ── light theme ──────────────────────────────────────
   Warm paper rather than white — keeps the editorial feel
   and is easier on the eye for long reading. The hawk and
   dove colours are darkened so they stay legible on it. */
[data-theme="light"]{
  --ground:#F6F3EC;
  --panel:#FFFFFF;
  --panel-2:#EDE8DE;
  --rule:#D6CFC1;
  --rule-soft:#E6E0D3;
  --text:#171F28;
  --text-2:#47555F;
  --muted:#7A8792;
  --hawk:#B26708;
  --dove:#136F84;
  --hold:#6E7C88;
  --flash:#C7431F;
  --masthead:rgba(246,243,236,.94);
  --shadow:rgba(60,50,30,.14);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ground);color:var(--text);
  font-family:var(--display);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--hawk);outline-offset:2px;border-radius:2px}

/* ── masthead ─────────────────────────────────── */
.masthead{
  position:sticky;top:0;z-index:40;background:var(--masthead);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--rule);
}
.masthead-inner{
  max-width:1240px;margin:0 auto;padding:12px 20px;
  display:flex;align-items:center;gap:18px;
}
.wordmark{display:flex;align-items:baseline;gap:9px;flex-shrink:0}
.wordmark b{font-weight:700;letter-spacing:-.02em;font-size:19px}
.wordmark span{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
  color:var(--muted);text-transform:uppercase;
}
.searchwrap{flex:1;position:relative;max-width:420px;min-width:0}
.searchwrap input{
  width:100%;background:var(--panel);border:1px solid var(--rule);
  border-radius:3px;padding:8px 12px 8px 32px;color:var(--text);
  font-family:var(--mono);font-size:12.5px;
}
.searchwrap input::placeholder{color:var(--muted)}
.searchwrap input:focus{outline:none;border-color:var(--hold)}
.searchwrap::before{
  content:"⌕";position:absolute;left:11px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:15px;pointer-events:none;
}
.status{
  margin-left:auto;display:flex;align-items:center;gap:7px;
  font-family:var(--mono);font-size:10.5px;color:var(--muted);
  white-space:nowrap;
}
.pulse{
  width:6px;height:6px;border-radius:50%;background:var(--dove);
  box-shadow:0 0 0 0 rgba(79,195,217,.6);animation:pulse 2.4s infinite;
}
.pulse.seeded{background:var(--hold);animation:none}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(79,195,217,.5)}
  70%{box-shadow:0 0 0 7px rgba(79,195,217,0)}
  100%{box-shadow:0 0 0 0 rgba(79,195,217,0)}
}

/* ── rates rail (the signature) ───────────────── */
.rail{border-bottom:1px solid var(--rule);background:var(--panel);overflow:hidden}
.rail-inner{
  max-width:1240px;margin:0 auto;padding:0 20px;
  display:flex;overflow-x:auto;scrollbar-width:none;
}
.rail-inner::-webkit-scrollbar{display:none}
.rail-label{
  flex-shrink:0;display:flex;align-items:center;padding-right:16px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  color:var(--muted);text-transform:uppercase;border-right:1px solid var(--rule-soft);
  margin-right:2px;
}
.cb{
  flex-shrink:0;padding:9px 15px;border-right:1px solid var(--rule-soft);
  display:flex;flex-direction:column;gap:2px;position:relative;
}
.cb::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--bias-c);
}
.cb-name{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--muted)}
.cb-rate{
  font-family:var(--mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;
  display:flex;align-items:center;gap:5px;
}
.cb-arrow{font-size:10px;color:var(--bias-c)}

/* ── layout ───────────────────────────────────── */
.shell{max-width:1240px;margin:0 auto;padding:0 20px;display:grid;
  grid-template-columns:196px minmax(0,1fr) 244px;gap:30px;align-items:start}

/* ── filters ──────────────────────────────────── */
.side{position:sticky;top:112px;padding:22px 0 40px}
.fgroup{margin-bottom:22px}
.fgroup h4{
  margin:0 0 8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;
  color:var(--muted);text-transform:uppercase;font-weight:500;
}
.chip{
  display:block;width:100%;text-align:left;padding:4px 8px;margin-bottom:1px;
  border-radius:3px;font-size:13px;color:var(--text-2);
  border-left:2px solid transparent;transition:background .12s,color .12s;
}
.chip:hover{background:var(--panel);color:var(--text)}
.chip.on{background:var(--panel-2);color:var(--text);border-left-color:var(--hawk);font-weight:500}
.chip em{
  font-style:normal;float:right;font-family:var(--mono);
  font-size:10px;color:var(--muted);padding-top:2px;
}

/* ── feed ─────────────────────────────────────── */
.feed{padding:22px 0 80px;min-width:0}
.daybar{
  display:flex;align-items:baseline;gap:10px;
  padding:22px 0 9px;margin-bottom:4px;border-bottom:1px solid var(--rule);
}
.feed > .daybar:first-child{padding-top:0}
.daybar h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.daybar .dow{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.08em}
.daybar .cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted)}

.item{
  display:block;padding:15px 0 15px 15px;border-bottom:1px solid var(--rule-soft);
  border-left:2px solid var(--bias-c);position:relative;transition:background .12s;
}
.item:hover{background:var(--panel)}
.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.time{
  font-family:var(--mono);font-size:11px;font-weight:500;color:var(--text-2);
  font-variant-numeric:tabular-nums;
}
.src{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.tag{
  font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 6px;border-radius:2px;border:1px solid var(--rule);color:var(--muted);
}
.tag.bias{color:var(--bias-c);border-color:var(--bias-c);opacity:.85}
.item h3{
  margin:0 0 6px;font-size:16px;line-height:1.35;font-weight:600;letter-spacing:-.01em;
}
.item:hover h3{color:var(--hawk)}
.sum{margin:0 0 9px;font-size:13.5px;line-height:1.55;color:var(--text-2)}
.why{
  margin:0;padding-left:11px;border-left:1px solid var(--rule);
  font-family:var(--editorial);font-size:14px;line-height:1.55;color:var(--text-2);
}
.why b{
  font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);display:block;margin-bottom:3px;font-weight:500;
}
.cluster{
  margin-top:8px;font-family:var(--mono);font-size:10px;color:var(--muted);
}

/* ── hot list ─────────────────────────────────── */
.hot{position:sticky;top:112px;padding:22px 0 40px}
.hot h4{
  margin:0 0 10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;
  color:var(--muted);text-transform:uppercase;font-weight:500;
}
.hotitem{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule-soft)}
.hotrank{
  font-family:var(--mono);font-size:11px;font-weight:600;color:var(--hawk);
  flex-shrink:0;width:14px;font-variant-numeric:tabular-nums;
}
.hotbody{min-width:0}
.hotbody p{margin:0 0 3px;font-size:12.5px;line-height:1.4;color:var(--text-2)}
.hotitem:hover .hotbody p{color:var(--text)}
.hotmeta{font-family:var(--mono);font-size:9.5px;color:var(--muted)}

/* ── theme toggle ─────────────────────────────── */
.themetoggle{
  position:fixed;left:20px;bottom:20px;z-index:60;
  display:flex;align-items:center;gap:7px;
  padding:7px 12px 7px 10px;border-radius:20px;
  background:var(--panel);border:1px solid var(--rule);
  box-shadow:0 2px 10px var(--shadow);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);
  transition:color .15s,border-color .15s,transform .15s;
}
.themetoggle:hover{color:var(--text);border-color:var(--hold);transform:translateY(-1px)}
.themetoggle svg{width:13px;height:13px;flex-shrink:0;stroke:currentColor;
  fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.themetoggle .moon{display:none}
[data-theme="light"] .themetoggle .moon{display:block}
[data-theme="light"] .themetoggle .sun{display:none}

.empty{padding:60px 0;text-align:center;color:var(--muted)}
.empty p{margin:0 0 6px;font-size:14px}
.empty button{
  font-family:var(--mono);font-size:11px;color:var(--hawk);
  border-bottom:1px solid var(--hawk);padding-bottom:1px;
}

footer{
  border-top:1px solid var(--rule);margin-top:20px;
}
.foot-inner{
  max-width:1240px;margin:0 auto;padding:20px;
  font-family:var(--mono);font-size:10.5px;color:var(--muted);
  display:flex;gap:18px;flex-wrap:wrap;
}

/* ── responsive ───────────────────────────────── */
@media (max-width:1080px){
  .shell{grid-template-columns:174px minmax(0,1fr)}
  .hot{display:none}
}
@media (max-width:760px){
  .themetoggle{left:auto;right:14px;bottom:14px;padding:8px 11px}
  .themetoggle span{display:none}
  .masthead-inner{flex-wrap:wrap;gap:10px}
  .searchwrap{max-width:none;order:3;flex-basis:100%}
  .status{margin-left:auto}
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  .side{position:static;padding:16px 0 0;border-bottom:1px solid var(--rule)}
  .fgroup{margin-bottom:14px}
  .fgroup > div{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .fgroup > div::-webkit-scrollbar{display:none}
  .chip{width:auto;flex-shrink:0;white-space:nowrap;border-left:none;
    border:1px solid var(--rule);padding:4px 10px;font-size:12.5px}
  .chip.on{border-color:var(--hawk)}
  .chip em{float:none;margin-left:6px}
  .item h3{font-size:15px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

<footer><div class="foot-inner">

 sum:"Shipping has been restricted since late February. Central banks from Frankfurt to Singapore now cite the same shock in their statements.",
 why:"This is the single common variable across every policy statement this quarter, which makes cross-bank divergence a question of how each one weighs a supply shock — not of differing views on the shock itself."},

{id:"e2", ts:"2026-08-18T11:15:00+08:00", source:"Bureau of Labor Statistics", extra:1, region:"US", topic:"inflation", bias:"dovish", score:72,
 title:"July PPI unchanged on the month, annual rate down to 4.7% from 5.5%",
 sum:"Consensus had looked for a 0.2% monthly gain. July CPI rose 0.1% month on month.",
 why:"Two consecutive cooling prints are what drove September hike odds sharply lower. Producer prices leading consumer prices down is the sequencing the doves need, and it is now visible in the data rather than just the forecast."}
];

/* ══════════════════════════════════════════════════════════════ */

const REGIONS = ["US","Euro area","UK","ASEAN","Global"];
const TOPICS = [
  ["policy","Monetary policy"],["inflation","Inflation"],["growth","Growth"],
  ["labour","Labour"],["markets","Markets & FX"],["fiscal","Fiscal & trade"],["research","Research"]
];
const BIASES = [["hawkish","Hawkish"],["dovish","Dovish"],["neutral","Neutral"]];
const BIAS_COLOR = {hawkish:"var(--hawk)", dovish:"var(--dove)", neutral:"var(--hold)"};
const ARROW = {hawkish:"▲", dovish:"▼", neutral:"■"};

let ITEMS = SEED.slice();
let live = false;
let lastFetch = null;
const state = {q:"", region:null, topic:null, bias:null};

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ── rates rail ─────────────────────────────── */
function drawRail(){
  const rail = $("#rail");
  rail.querySelectorAll(".cb").forEach(n => n.remove());
  BANKS.forEach(b => {
    const el = document.createElement("div");
    el.className = "cb";
    el.style.setProperty("--bias-c", BIAS_COLOR[b.bias]);
    el.title = b.note;
    el.innerHTML = `<span class="cb-name">${esc(b.code)}</span>
      <span class="cb-rate">${esc(b.rate)}<span class="cb-arrow">${ARROW[b.bias]}</span></span>`;
    rail.appendChild(el);
  });
}

/* ── filters ────────────────────────────────── */
function counts(key){
  const base = ITEMS.filter(i => match(i, {...state, [key]:null}));
  const m = {};
  base.forEach(i => { m[i[key]] = (m[i[key]] || 0) + 1; });
  return m;
}

function drawFilters(){
  const build = (host, opts, key) => {
    const c = counts(key);
    host.innerHTML = "";
    const all = document.createElement("button");
    all.className = "chip" + (state[key] === null ? " on" : "");
    all.textContent = "All";
    all.onclick = () => { state[key] = null; render(); };
    host.appendChild(all);
    opts.forEach(o => {
      const [val, label] = Array.isArray(o) ? o : [o, o];
      const n = c[val] || 0;
      const b = document.createElement("button");
      b.className = "chip" + (state[key] === val ? " on" : "");
      b.innerHTML = `${esc(label)}<em>${n}</em>`;
      b.onclick = () => { state[key] = state[key] === val ? null : val; render(); };
      host.appendChild(b);
    });
  };
  build($("#f-region"), REGIONS, "region");
  build($("#f-topic"), TOPICS, "topic");
}

/* ── matching ───────────────────────────────── */
function match(i, s){
  if (s.region && i.region !== s.region) return false;
  if (s.topic && i.topic !== s.topic) return false;
  if (s.bias && i.bias !== s.bias) return false;
  if (s.q){
    const hay = (i.title + " " + i.sum + " " + i.why + " " + i.source + " " +
                 i.region + " " + i.topic).toLowerCase();
    if (!s.q.toLowerCase().split(/\s+/).filter(Boolean).every(t => hay.includes(t))) return false;
  }
  return true;
}

/* ── feed ───────────────────────────────────── */
const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON = ["January","February","March","April","May","June","July",
             "August","September","October","November","December"];

function dayKey(d){ return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate(); }

function renderFeed(){
  const feed = $("#feed");
  const list = ITEMS.filter(i => match(i, state))
                    .sort((a,b) => new Date(b.ts) - new Date(a.ts));
  feed.innerHTML = "";

  if (!list.length){
    feed.innerHTML = `<div class="empty"><p>Nothing matches those filters.</p>
      <button onclick="clearAll()">Clear all filters</button></div>`;
    return;
  }

  let cur = null;
  const groups = [];
  list.forEach(i => {
    const d = new Date(i.ts), k = dayKey(d);
    if (k !== cur){ cur = k; groups.push({d, items:[]}); }
    groups[groups.length-1].items.push(i);
  });

  groups.forEach(g => {
    const bar = document.createElement("div");
    bar.className = "daybar";
    bar.innerHTML = `<h2>${g.d.getDate()} ${MON[g.d.getMonth()]}</h2>
      <span class="dow">${DOW[g.d.getDay()].toUpperCase()}</span>
      <span class="cnt">${g.items.length} item${g.items.length>1?"s":""}</span>`;
    feed.appendChild(bar);

    g.items.forEach(i => {
      const d = new Date(i.ts);
      const hh = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
      const topicLabel = (TOPICS.find(t => t[0] === i.topic) || [,i.topic])[1];
      const a = document.createElement("a");
      a.className = "item";
      a.href = i.url || "#";
      a.style.setProperty("--bias-c", BIAS_COLOR[i.bias]);
      a.innerHTML = `
        <div class="meta">
          <span class="time">${hh}</span>
          <span class="src">${esc(i.source)}</span>
          <span class="tag">${esc(i.region)}</span>
          <span class="tag">${esc(topicLabel)}</span>
          ${i.bias && i.bias !== "neutral" ? `<span class="tag bias">${esc(i.bias)}</span>` : ""}
        </div>
        <h3>${esc(i.title)}</h3>
        ${i.sum ? `<p class="sum">${esc(i.sum)}</p>` : ""}
        ${i.why ? `<p class="why"><b>Why it matters</b>${esc(i.why)}</p>` : ""}
        ${i.extra ? `<div class="cluster">+ ${i.extra} other source${i.extra>1?"s":""} covering this</div>` : ""}`;
      feed.appendChild(a);
    });
  });
}

/* ── hot list ───────────────────────────────── */
function renderHot(){
  const host = $("#hotlist");
  const now = Date.now();
  const ranked = ITEMS.map(i => {
    const hrs = (now - new Date(i.ts)) / 3.6e6;
    return {i, heat: (i.score + (i.extra || 0) * 6) * Math.exp(-hrs / 60)};
  }).sort((a,b) => b.heat - a.heat).slice(0, 6);

  host.innerHTML = "";
  ranked.forEach((r, n) => {
    const el = document.createElement("a");
    el.className = "hotitem";
    el.href = r.i.url || "#";
    el.innerHTML = `<span class="hotrank">${n+1}</span>
      <span class="hotbody"><p>${esc(r.i.title)}</p>
      <span class="hotmeta">${esc(r.i.region)} · ${esc(r.i.source)}</span></span>`;
    host.appendChild(el);
  });
}

function clearAll(){
  state.q = ""; state.region = null; state.topic = null; state.bias = null;
  $("#q").value = "";
  render();
}

function render(){ drawFilters(); renderFeed(); renderHot(); }

/* ── live refresh ───────────────────────────── */
function setStatus(){
  const p = $("#pulse"), t = $("#statustext");
  if (!live){
    p.classList.add("seeded");
    t.textContent = "seed data · no feed.json";
    return;
  }
  p.classList.remove("seeded");
  const mins = Math.floor((Date.now() - lastFetch) / 60000);
  t.textContent = "live · updated " + (mins < 1 ? "just now" : mins + "m ago");
}

async function pull(){
  try {
    const r = await fetch("feed.json", {cache:"no-store"});
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    const rows = Array.isArray(data) ? data : data.items;
    if (Array.isArray(rows) && rows.length){
      ITEMS = rows;
      if (data.banks) { BANKS.length = 0; data.banks.forEach(b => BANKS.push(b)); drawRail(); }
      live = true; lastFetch = Date.now();
      render();
    }
  } catch (e) {
    live = false;
  }
  setStatus();
}

/* ── theme ──────────────────────────────────────
   Order of preference: what the user last chose, then
   what their operating system is set to, then dark.
   localStorage is wrapped because some embedded
   previews block it — the toggle still works there,
   it just forgets the choice on reload. */
function readStoredTheme(){
  try { return localStorage.getItem("seabit-theme"); } catch (e) { return null; }
}
function storeTheme(t){
  try { localStorage.setItem("seabit-theme", t); } catch (e) { /* no-op */ }
}

function applyTheme(theme){
  if (theme === "light") document.documentElement.setAttribute("data-theme","light");
  else document.documentElement.removeAttribute("data-theme");

  $("#themelabel").textContent = theme === "light" ? "Dark" : "Light";
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", theme === "light" ? "#F6F3EC" : "#0E1621");
}

function initTheme(){
  const stored = readStoredTheme();
  const prefersLight = window.matchMedia &&
    window.matchMedia("(prefers-color-scheme: light)").matches;
  applyTheme(stored || (prefersLight ? "light" : "dark"));
}

$("#themetoggle").addEventListener("click", () => {
  const now = document.documentElement.getAttribute("data-theme") === "light"
    ? "dark" : "light";
  applyTheme(now);
  storeTheme(now);
});

/* ── boot ───────────────────────────────────── */
initTheme();
let debounce;
$("#q").addEventListener("input", e => {
  clearTimeout(debounce);
  debounce = setTimeout(() => { state.q = e.target.value.trim(); render(); }, 110);
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("#q")){ e.preventDefault(); $("#q").focus(); }
  if (e.key === "Escape" && document.activeElement === $("#q")) $("#q").blur();
});

drawRail();
render();
setStatus();
pull();
setInterval(pull, 300000);
setInterval(setStatus, 30000);
</script>
</body>
</html>
